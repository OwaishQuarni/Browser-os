name: Build Browser OS ISO
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y live-build debootstrap squashfs-tools xorriso mtools dosfstools \
            syslinux syslinux-common isolinux grub-efi-amd64-bin grub-pc-bin zstd ca-certificates
      - name: Build ISO
        run: bash build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Browser OS (latest build)
          files: BrowserOS.iso
