name: Build Browser OS ISO
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y live-build debootstrap squashfs-tools xorriso mtools dosfstools \
            syslinux syslinux-common isolinux grub-efi-amd64-bin grub-pc-bin zstd ca-certificates
      - name: Build ISO
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BrowserOS-iso
          path: BrowserOS.iso
